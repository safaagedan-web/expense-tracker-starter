<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

      <header>
        <nav class="navbar navbar-dark bg-dark">
          <div class="container">
            <a class="navbar-brand" href="#">
              Expense Tracker
            </a>
             <button id="darkModeBtn" class="btn btn-outline-light">
            🌙 Dark Mode
        </button>
          </div>
        </nav>
            </header>
            <main>
        <div class="container mt-4">
    <div class="row">

        <!-- total amount -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Total Expenses</h5>
                    <p class="card-text" id="totalExpenses">0.00</p>
                </div>
            </div>
        </div>

        <!-- Number of Expenses -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Number of Expenses</h5>
                    <p class="card-text" id="expenseCount">0</p>
                </div>
            </div>
        </div>

        <!-- Highest Expense -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Highest Expense</h5>
                    <p class="card-text" id="highestExpense">0.00</p>
                </div>
            </div>
        </div>

    </div>
</div>
<div class="container mt-4">
  <h3>Add Expense</h3>
  <form id="expenseForm">

    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" id="title" class="form-control">
    </div>

    <div class="mb-3">
      <label for="amount" class="form-label">Amount</label>
      <input type="number" id="amount" class="form-control"  min="0.01" step="0.01"  step="0.01">
    </div>
    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select name="" id="category" class="form-select">
        <option value="">Select Category</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="date" class="form-label">Date</label>
      <input type="date" id="date" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">
      Add Expense
    </button>
  </form>

  <div class="container mt-4">
    <h3>Expenses</h3>
     <div class="mb-3">
        <label for="titleSearch" class="form-label">Search by Title</label>

        <input 
            type="text" 
            id="titleSearch" 
            class="form-control" 
            placeholder="Search by title">
    </div>
<div class="mb-3">
    <label for="categoryFilter" class="form-label">Filter by Category</label>

    <select id="categoryFilter" class="form-select">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
    </select>
</div>
<div id="loadingSpinner" class="text-center my-3 d-none">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
<div class="table-responsive">
     <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="expensesTable">
        </tbody>
    </table>

</div>
   
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editId">

                <div class="mb-3">
                    <label for="editTitle" class="form-label">Title</label>
                    <input type="text" id="editTitle" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="editAmount" class="form-label">Amount</label>
                    <input type="number" id="editAmount" class="form-control"
                           min="0.01" step="0.01">
                </div>

                <div class="mb-3">
                    <label for="editCategory" class="form-label">Category</label>
                    <select id="editCategory" class="form-select">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="editDate" class="form-label">Date</label>
                    <input type="date" id="editDate" class="form-control">
                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button type="button" class="btn btn-primary" id="saveEditBtn">
                    Save Changes
                </button>
            </div>

        </div>
    </div>
</div>
</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
